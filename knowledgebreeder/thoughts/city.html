<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f4f1ea; --ink:#1d2430; --soft:#5b6472; --line:#d9d3c6; --card:#fffdf8;
  --wall-l:#e9e4d8; --wall-r:#d3ccbd; --win:#b9b2a2; --lit:#f2a81d; --edge:#8a8474;
  --accent:#0b6bcb; --accent-ink:#ffffff; --tied:#c2410c; --plate-l:90%; --roof-s:38%; --roof-l:60%;
  --slab-l:74%; --lane:#00000014; --shadow:0 1px 2px #0000001a, 0 8px 24px #0000000f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --ink:#e8ecf2; --soft:#9aa6b6; --line:#2a3340; --card:#171e29;
    --wall-l:#3a4554; --wall-r:#2b3441; --win:#1c232d; --lit:#ffc94a; --edge:#0b0f15;
    --accent:#6cb6ff; --accent-ink:#06121f; --tied:#ff9a62; --plate-l:20%; --roof-s:30%; --roof-l:46%;
    --slab-l:13%; --lane:#ffffff12; --shadow:0 1px 2px #00000066, 0 8px 24px #00000040;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 40px}
header h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--soft)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:16px 0 8px}
.bar label{display:flex;gap:8px;align-items:center;color:var(--soft);font-size:.92rem}
.bar select,.bar input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px}
.bar input{min-width:0;width:min(100%,240px)}
.lang{margin-inline-start:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:40px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--soft);font-size:.86rem;margin:4px 0 10px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend svg{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;align-items:center}
.chips .cap{color:var(--soft);font-size:.86rem;width:100%}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:.9rem}
.chip b{font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--tied);border-color:var(--tied);color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.town{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));grid-auto-flow:dense;align-items:start;gap:14px}
.district{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0}
.district.wide{grid-column:span 2}
.district h2{font-size:1rem;margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.district h2::before{content:"";width:10px;height:10px;border-radius:3px;background:hsl(var(--hue) var(--roof-s) var(--roof-l));flex:none;align-self:center}
.count{color:var(--soft);font-weight:500;font-size:.86rem}
.scene{display:flex;justify-content:center;overflow:hidden}
svg.iso{max-width:100%;height:auto;display:block}
.plate{fill:hsl(var(--hue) 30% var(--plate-l))}
.slab-l{fill:hsl(var(--hue) 22% var(--slab-l))}
.slab-r{fill:hsl(var(--hue) 22% calc(var(--slab-l) - 7%))}
.lane{stroke:var(--lane);stroke-width:5;fill:none}
.b{cursor:pointer;outline:none;transition:opacity .15s}
.wl{fill:var(--wall-l)} .wr{fill:var(--wall-r)}
.rf{fill:hsl(var(--hue) var(--roof-s) var(--roof-l))}
.wl,.wr,.rf{stroke:var(--edge);stroke-width:.6;stroke-linejoin:round}
.wn{fill:var(--win)}
.b.lit .wn{fill:var(--lit)}
.flag{fill:var(--tied);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.crane{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lb{direction:ltr;unicode-bidi:plaintext;font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.sign{fill:var(--card);stroke:var(--soft);stroke-width:1.4}
.sign-t{font-weight:500;fill:var(--soft);stroke:none;font-size:10px}
.b:hover .rf,.b:focus-visible .rf{stroke:var(--accent);stroke-width:2}
.b.sel .rf{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.b.sel .wl,.b.sel .wr{stroke:var(--accent);stroke-width:1.4}
.b.on .rf{fill:var(--tied);stroke:var(--tied);stroke-width:1.6}
.town.focus .b:not(.on):not(.sel){opacity:.22}
.town.focus .lb:not(.on){opacity:.3}
.names{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pick{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-height:34px;cursor:pointer;font-size:.86rem;text-align:start}
.pick:hover{border-color:var(--accent)}
.pick.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick.on{border-color:var(--tied);color:var(--tied)}
.pick.hide{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;box-shadow:var(--shadow)}
.panel h2{font-size:1.2rem;line-height:1.25;margin:0 0 6px;padding-inline-end:36px}
.panel .one{margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px;padding:0;list-style:none}
.meta li{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--soft)}
.panel h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:14px 0 4px}
html[dir="rtl"] .panel h3{letter-spacing:0;font-size:.9rem}
.panel ul{margin:0;padding-inline-start:18px}
.panel li{margin:3px 0;overflow-wrap:anywhere}
.panel .why{color:var(--soft)}
.tag{font-size:.74rem;border-radius:6px;padding:1px 6px;margin-inline-start:6px;white-space:nowrap;border:1px solid var(--line);color:var(--soft)}
.tag.no{border-color:var(--tied);color:var(--tied)}
.jump{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.close{position:absolute;inset-inline-end:10px;top:10px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem;line-height:1}
.empty{color:var(--soft);margin:0}
.reports{margin-top:28px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--soft);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rep{max-width:920px}
.rep .note{color:var(--soft);font-size:.9rem;margin:0 0 12px}
.rep h3{font-size:1rem;margin:20px 0 6px}
.rep ul,.rep ol{margin:0;padding-inline-start:20px}
.rep li{margin:7px 0;overflow-wrap:anywhere}
.rep .why{display:block;color:var(--soft);font-size:.93rem}
.rep .show{margin-inline-start:8px;font-size:.8rem;border:1px solid var(--line);background:none;border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--soft);min-height:28px}
.rep .show:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:32px;color:var(--soft);font-size:.86rem;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .district.wide{grid-column:auto}
  .panel{position:fixed;inset-inline:0;bottom:0;top:auto;max-height:52vh;border-radius:16px 16px 0 0;border-bottom:0;z-index:5;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .panel.idle{display:none}
  body.sheet .wrap{padding-bottom:56vh}
}
@media (min-width:981px){.close{display:none}}
@media (prefers-reduced-motion: reduce){.b{transition:none}}
@media print{.bar,.chips,.tabs,.lang,.close{display:none}.panel{position:static;max-height:none;box-shadow:none}.rep[hidden]{display:block!important}}
.city{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));grid-auto-flow:dense;align-items:start;gap:14px}
.city.focus .b:not(.on):not(.sel){opacity:.22}
.city.focus .lb:not(.on){opacity:.3}
.r-infrastructure .rf{fill:hsl(var(--hue) var(--roof-s) var(--roof-l))}
.r-resource .rf{fill:#c58a2b}
.r-utility .rf{fill:#3f8f6b}
.dome{fill:#e2b45c;stroke:var(--edge);stroke-width:.6}
.mast{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.col{stroke:var(--edge);stroke-width:1.4;opacity:.55}
.lot{fill:none;stroke:var(--tied);stroke-width:1.4;stroke-dasharray:4 3}
.post{stroke:var(--ink);stroke-width:1.4}
.board{fill:var(--card);stroke:var(--tied);stroke-width:1.2}
.ring{fill:none;stroke:var(--lit);stroke-width:2.6}
.b:hover .lot,.b:focus-visible .lot{stroke:var(--accent);stroke-width:2}
.b.sel .lot,.b.on .lot{stroke-width:2.4;stroke-dasharray:none}
.b.sel .board{fill:var(--accent)}
.b.on .board{fill:var(--tied)}
.pick.r-need{border-style:dashed}
.explain{color:var(--soft);font-size:.86rem;margin:2px 0 10px;max-width:880px}
.bar .explain{width:100%;margin:0}
.more h2{font-size:1.15rem;margin:28px 0 4px}
.more ul{padding-inline-start:20px;margin:0}
.more li{margin:8px 0;overflow-wrap:anywhere}
.cmd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.cmd code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.85rem;direction:ltr;unicode-bidi:isolate}
.copy{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:3px 10px;min-height:32px;cursor:pointer;font-size:.85rem}
.copy:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">__TITLE__</h1>
    <p id="sub"></p>
  </header>
  <div class="bar">
    <input id="q" type="search" autocomplete="off" data-i18n-ph="search">
    <select id="role" aria-label="role"><option value="" data-i18n="role_all"></option><option value="infrastructure" data-i18n="infrastructure"></option><option value="resource" data-i18n="resource"></option><option value="utility" data-i18n="utility"></option><option value="need" data-i18n="need"></option></select>
    <button class="lang" id="lang" type="button"></button>
    <p class="explain"><span data-i18n="x_search"></span> <span data-i18n="x_role"></span> <span data-i18n="x_lang"></span></p>
  </div>
  <ul class="legend">
    <li><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><rect x="1" y="7" width="20" height="8" fill="var(--wall-r)"/></svg><span data-i18n="legend_infrastructure"></span></li>
    <li><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="4" y="9" width="10" height="8" fill="var(--wall-r)"/><path d="M3,9a6,6 0 0 1 12,0z" fill="#e2b45c"/></svg><span data-i18n="legend_resource"></span></li>
    <li><svg width="14" height="20" viewBox="0 0 14 20" aria-hidden="true"><rect x="4" y="6" width="6" height="13" fill="var(--wall-r)"/><path class="mast" d="M7,6v-5m-3,2h6"/></svg><span data-i18n="legend_utility"></span></li>
    <li><svg width="22" height="16" viewBox="0 0 22 16" aria-hidden="true"><polygon class="lot" points="2,11 11,6 20,11 11,15"/></svg><span data-i18n="legend_need"></span></li>
    <li><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle class="ring" cx="8" cy="8" r="5"/></svg><span data-i18n="legend_ring"></span></li>
    <li><svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><rect x="2" y="9" width="6" height="8" fill="var(--wall-r)"/><rect x="11" y="2" width="6" height="15" fill="var(--wall-r)"/></svg><span data-i18n="legend_h"></span></li>
  </ul>
  <p class="explain" data-i18n="x_pick"></p>
  <div class="layout">
    <main class="city" id="city"><!--__DISTRICTS__--></main>
    <aside class="panel idle" id="panel" aria-live="polite"></aside>
  </div>
  <section class="more" id="marriages"></section>
  <section class="more" id="gaps"></section>
  <footer><span data-i18n="private"></span> <span id="made"></span></footer>
</div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var lang = D.lang, sel = null, focus = null;
var city = document.getElementById("city"), panel = document.getElementById("panel");
function t(k, vars){
  var s = (D.labels[lang] && D.labels[lang][k]) || D.labels.en[k] || k;
  if (vars) for (var v in vars) s = s.replace("{" + v + "}", "⁦" + String(vars[v]) + "⁩");
  return s;
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function tx(text){ return el("bdi", "", text); }
function subj(s){ return D.special[s] ? t(D.special[s]) : s; }      // kb's own district names, in the page's language
function all(q, root){ return Array.prototype.slice.call((root || document).querySelectorAll(q)); }
function joined(id){
  var out = [];
  D.links.forEach(function(l){
    if (l.a === id) out.push({other: l.b, label: t("j_" + l.kind + "_out"), words: l.words, why: l.why});
    else if (l.b === id) out.push({other: l.a, label: t("j_" + l.kind + "_in"), words: l.words, why: l.why});
  });
  return out;
}
function children(id){
  var out = [];
  for (var k in D.thoughts) if (D.thoughts[k].parents.indexOf(id) >= 0) out.push(k);
  return out;
}
function paint(){
  var on = {};
  (focus || []).forEach(function(id){ on[id] = 1; });
  if (sel){ joined(sel).forEach(function(j){ on[j.other] = 1; }); D.thoughts[sel].parents.concat(children(sel)).forEach(function(x){ on[x] = 1; }); }
  city.classList.toggle("focus", !!(sel || focus));
  all(".b").forEach(function(b){
    var id = b.getAttribute("data-id");
    b.classList.toggle("sel", id === sel); b.classList.toggle("on", !!on[id] && id !== sel);
  });
  all(".lb[data-for]").forEach(function(l){ var id = l.getAttribute("data-for"); l.classList.toggle("on", id === sel || !!on[id]); });
  all(".pick").forEach(function(p){
    var id = p.getAttribute("data-id");
    p.classList.toggle("sel", id === sel); p.classList.toggle("on", !!on[id] && id !== sel);
  });
}
function select(id, scroll){
  sel = id; renderPanel(); paint();
  document.body.classList.toggle("sheet", !!id);
  if (id && scroll){ var b = document.getElementById("b-" + id); if (b && b.scrollIntoView) b.scrollIntoView({block: "center"}); }
}
function jump(id){
  var a = el("a", "jump"); a.href = "#"; a.appendChild(tx(D.thoughts[id] ? D.thoughts[id].text : id));
  a.addEventListener("click", function(e){ e.preventDefault(); select(id, true); });
  return a;
}
function head(parent, text){ parent.appendChild(el("h3", "", text)); }
function renderPanel(){
  panel.textContent = "";
  panel.classList.toggle("idle", !sel);
  if (!sel){ panel.appendChild(el("p", "empty", t("pick"))); return; }
  var c = D.thoughts[sel];
  var x = el("button", "close", "×"); x.type = "button"; x.setAttribute("aria-label", t("close"));
  x.addEventListener("click", function(){ select(null); });
  panel.appendChild(x);
  var h = el("h2"); h.appendChild(tx(c.text)); panel.appendChild(h);
  var meta = el("ul", "meta");
  [t(c.role), subj(c.subject)].forEach(function(m){ meta.appendChild(el("li")).appendChild(tx(m)); });
  panel.appendChild(meta);
  c.check.forEach(function(f){ panel.appendChild(el("p", "why", t("check", {f: f}))); });
  head(panel, t("from"));
  var where = c.from && c.from.indexOf(c.source) === 0 ? c.from : c.source + (c.from ? " · " + c.from : "");
  var p = el("p"); p.appendChild(tx(where + (c.ref ? " (" + c.ref + ")" : ""))); panel.appendChild(p);
  if (c.quote){ head(panel, t("quote")); var q = el("p", "why"); q.appendChild(tx(c.quote)); panel.appendChild(q); }
  var js = joined(sel);
  if (js.length){
    head(panel, t("joins"));
    var ul = el("ul");
    js.forEach(function(j){
      var li = el("li"); li.appendChild(document.createTextNode(j.label + ": ")); li.appendChild(jump(j.other));
      if (j.words) li.appendChild(el("span", "tag", t("by_words")));
      if (j.why){ var w = el("span", "why"); w.appendChild(document.createTextNode(" ")); w.appendChild(tx(j.why)); li.appendChild(w); }
      ul.appendChild(li);
    });
    panel.appendChild(ul);
  }
  [["parents", c.parents], ["children", children(sel)]].forEach(function(kv){
    if (!kv[1].length) return;
    head(panel, t(kv[0]));
    var ul = el("ul");
    kv[1].forEach(function(id){ ul.appendChild(el("li")).appendChild(jump(id)); });
    panel.appendChild(ul);
  });
}
function copyButton(text){
  var b = el("button", "copy", t("copy")); b.type = "button";
  b.addEventListener("click", function(){
    var done = function(){ b.textContent = t("copied"); setTimeout(function(){ b.textContent = t("copy"); }, 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function(){});
    else { var a = el("textarea"); a.value = text; document.body.appendChild(a); a.select(); try { document.execCommand("copy"); done(); } catch (e) {} a.remove(); }
  });
  return b;
}
function cmd(parent, text){
  var row = el("div", "cmd"); row.appendChild(el("code", "", text)); row.appendChild(copyButton(text)); parent.appendChild(row);
}
function marriages(){
  var s = document.getElementById("marriages"); s.textContent = "";
  if (!D.marriages.length) return;
  s.appendChild(el("h2", "", t("marriages")));
  s.appendChild(el("p", "explain", t("m_note")));
  s.appendChild(el("p", "explain", t("x_copy")));
  var ul = el("ul");
  D.marriages.forEach(function(m){
    var li = el("li"); var b = el("strong"); b.appendChild(tx(m.child)); li.appendChild(b);
    li.appendChild(el("span", "tag", t(m.role)));
    [["parent", m.a], ["parent", m.b]].forEach(function(kv){
      var d = el("div", "why"); d.appendChild(document.createTextNode(t(kv[0]) + ": ")); d.appendChild(jump(kv[1].id));
      d.appendChild(document.createTextNode(" (")); d.appendChild(tx(subj(kv[1].subject))); d.appendChild(document.createTextNode(")"));
      li.appendChild(d);
    });
    if (m.why){ var w = el("div", "why"); w.appendChild(document.createTextNode(t("why") + ": ")); w.appendChild(tx(m.why)); li.appendChild(w); }
    m.notes.forEach(function(n){ var w = el("div", "why"); w.appendChild(tx(n)); li.appendChild(w); });
    cmd(li, "kb thoughts approve " + m.id);
    cmd(li, "kb thoughts decline " + m.id);
    ul.appendChild(li);
  });
  s.appendChild(ul);
}
function gaps(){
  var s = document.getElementById("gaps"); s.textContent = "";
  s.appendChild(el("h2", "", t("gaps")));
  s.appendChild(el("p", "explain", t("note")));
  var G = D.gaps, any = false;
  function block(key, items, make){
    if (!items.length) return;
    any = true;
    s.appendChild(el("h3", "", t("g_" + key)));
    var ul = el("ul"); items.forEach(function(it){ var li = el("li"); make(li, it); ul.appendChild(li); }); s.appendChild(ul);
  }
  var plain = function(li, x){ li.appendChild(tx(x)); };
  var one = function(li, x){ li.appendChild(jump(x.id)); };
  block("waits_model", G.waits_model, plain);
  block("waits_reader", G.waits_reader, plain);
  block("waits_frame", G.waits_frame, plain);
  block("contradictions", G.contradictions, function(li, x){ li.appendChild(jump(x.a.id)); li.appendChild(document.createTextNode(" ↔ ")); li.appendChild(jump(x.b.id)); });
  block("needs_alone", G.needs_alone, one);
  block("thin", G.thin, plain);
  block("alone", G.alone, one);
  if (!any) s.appendChild(el("p", "empty", t("none")));
}
function filter(){
  var q = document.getElementById("q").value.trim().toLowerCase(), r = document.getElementById("role").value;
  if (!q && !r){ focus = null; all(".pick").forEach(function(p){ p.classList.remove("hide"); }); paint(); return; }
  var hit = [];
  for (var id in D.thoughts){
    var c = D.thoughts[id];
    if ((!r || c.role === r) && (!q || (c.text + " " + c.subject + " " + c.source).toLowerCase().indexOf(q) >= 0)) hit.push(id);
  }
  all(".pick").forEach(function(p){ p.classList.toggle("hide", hit.indexOf(p.getAttribute("data-id")) < 0); });
  focus = hit; paint();
}
function words(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  var title = D.title || t("title");
  document.title = title;
  document.getElementById("h1").textContent = title;
  var married = 0; for (var k in D.thoughts) if (D.thoughts[k].parents.length) married++;
  document.getElementById("sub").textContent = t("sub", {n: Object.keys(D.thoughts).length, s: D.subjects, l: D.links.length, m: married});
  document.getElementById("made").textContent = t("made", {d: D.today});
  document.getElementById("lang").textContent = lang === "ar" ? "English" : "عربي";
  all("[data-i18n]").forEach(function(e){ e.textContent = t(e.getAttribute("data-i18n")); });
  all("[data-i18n-ph]").forEach(function(e){ e.placeholder = t(e.getAttribute("data-i18n-ph")); e.setAttribute("aria-label", e.placeholder); });
  renderPanel(); marriages(); gaps(); paint();
}
city.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".b, .pick") : null;
  if (b) select(b.getAttribute("data-id") === sel ? null : b.getAttribute("data-id"));
});
city.addEventListener("keydown", function(e){
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("b")){
    e.preventDefault();
    select(e.target.getAttribute("data-id") === sel ? null : e.target.getAttribute("data-id"));
  }
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape") select(null); });
document.getElementById("q").addEventListener("input", filter);
document.getElementById("role").addEventListener("change", filter);
document.getElementById("lang").addEventListener("click", function(){ lang = lang === "ar" ? "en" : "ar"; words(); });
words();
})();
</script>
</body>
</html>
