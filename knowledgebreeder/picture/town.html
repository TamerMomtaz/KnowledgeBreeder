<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>__TITLE__</title>
<style>
:root{
  --bg:#f4f1ea; --ink:#1d2430; --soft:#5b6472; --line:#d9d3c6; --card:#fffdf8;
  --wall-l:#e9e4d8; --wall-r:#d3ccbd; --win:#b9b2a2; --lit:#f2a81d; --edge:#8a8474;
  --accent:#0b6bcb; --accent-ink:#ffffff; --tied:#c2410c; --plate-l:90%; --roof-s:38%; --roof-l:60%;
  --slab-l:74%; --lane:#00000014; --shadow:0 1px 2px #0000001a, 0 8px 24px #0000000f;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10151d; --ink:#e8ecf2; --soft:#9aa6b6; --line:#2a3340; --card:#171e29;
    --wall-l:#3a4554; --wall-r:#2b3441; --win:#1c232d; --lit:#ffc94a; --edge:#0b0f15;
    --accent:#6cb6ff; --accent-ink:#06121f; --tied:#ff9a62; --plate-l:20%; --roof-s:30%; --roof-l:46%;
    --slab-l:13%; --lane:#ffffff12; --shadow:0 1px 2px #00000066, 0 8px 24px #00000040;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Naskh Arabic","Geeza Pro",Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:20px 16px 40px}
header h1{font-size:clamp(1.5rem,4vw,2.2rem);line-height:1.15;margin:0 0 4px;letter-spacing:-.01em}
header p{margin:0;color:var(--soft)}
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin:16px 0 8px}
.bar label{display:flex;gap:8px;align-items:center;color:var(--soft);font-size:.92rem}
.bar select,.bar input{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px}
.bar input{min-width:0;width:min(100%,240px)}
.lang{margin-inline-start:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 12px;min-height:40px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--soft);font-size:.86rem;margin:4px 0 10px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:6px}
.legend svg{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px;align-items:center}
.chips .cap{color:var(--soft);font-size:.86rem;width:100%}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;font-size:.9rem}
.chip b{font-weight:600;color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--tied);border-color:var(--tied);color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.town{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));grid-auto-flow:dense;align-items:start;gap:14px}
.district{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;min-width:0}
.district.wide{grid-column:span 2}
.district h2{font-size:1rem;margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.district h2::before{content:"";width:10px;height:10px;border-radius:3px;background:hsl(var(--hue) var(--roof-s) var(--roof-l));flex:none;align-self:center}
.count{color:var(--soft);font-weight:500;font-size:.86rem}
.scene{display:flex;justify-content:center;overflow:hidden}
svg.iso{max-width:100%;height:auto;display:block}
.plate{fill:hsl(var(--hue) 30% var(--plate-l))}
.slab-l{fill:hsl(var(--hue) 22% var(--slab-l))}
.slab-r{fill:hsl(var(--hue) 22% calc(var(--slab-l) - 7%))}
.lane{stroke:var(--lane);stroke-width:5;fill:none}
.b{cursor:pointer;outline:none;transition:opacity .15s}
.wl{fill:var(--wall-l)} .wr{fill:var(--wall-r)}
.rf{fill:hsl(var(--hue) var(--roof-s) var(--roof-l))}
.wl,.wr,.rf{stroke:var(--edge);stroke-width:.6;stroke-linejoin:round}
.wn{fill:var(--win)}
.b.lit .wn{fill:var(--lit)}
.flag{fill:var(--tied);stroke:var(--ink);stroke-width:1.2;stroke-linejoin:round}
.crane{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lb{direction:ltr;unicode-bidi:plaintext;font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--card);stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
.sign{fill:var(--card);stroke:var(--soft);stroke-width:1.4}
.sign-t{font-weight:500;fill:var(--soft);stroke:none;font-size:10px}
.b:hover .rf,.b:focus-visible .rf{stroke:var(--accent);stroke-width:2}
.b.sel .rf{fill:var(--accent);stroke:var(--accent);stroke-width:2}
.b.sel .wl,.b.sel .wr{stroke:var(--accent);stroke-width:1.4}
.b.on .rf{fill:var(--tied);stroke:var(--tied);stroke-width:1.6}
.town.focus .b:not(.on):not(.sel){opacity:.22}
.town.focus .lb:not(.on){opacity:.3}
.names{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pick{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-height:34px;cursor:pointer;font-size:.86rem;text-align:start}
.pick:hover{border-color:var(--accent)}
.pick.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pick.on{border-color:var(--tied);color:var(--tied)}
.pick.hide{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;box-shadow:var(--shadow)}
.panel h2{font-size:1.2rem;line-height:1.25;margin:0 0 6px;padding-inline-end:36px}
.panel .one{margin:0 0 10px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px;padding:0;list-style:none}
.meta li{font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--soft)}
.panel h3{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:14px 0 4px}
html[dir="rtl"] .panel h3{letter-spacing:0;font-size:.9rem}
.panel ul{margin:0;padding-inline-start:18px}
.panel li{margin:3px 0;overflow-wrap:anywhere}
.panel .why{color:var(--soft)}
.tag{font-size:.74rem;border-radius:6px;padding:1px 6px;margin-inline-start:6px;white-space:nowrap;border:1px solid var(--line);color:var(--soft)}
.tag.no{border-color:var(--tied);color:var(--tied)}
.jump{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.close{position:absolute;inset-inline-end:10px;top:10px;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:1.1rem;line-height:1}
.empty{color:var(--soft);margin:0}
.reports{margin-top:28px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;min-height:44px;cursor:pointer;color:var(--soft);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.rep{max-width:920px}
.rep .note{color:var(--soft);font-size:.9rem;margin:0 0 12px}
.rep h3{font-size:1rem;margin:20px 0 6px}
.rep ul,.rep ol{margin:0;padding-inline-start:20px}
.rep li{margin:7px 0;overflow-wrap:anywhere}
.rep .why{display:block;color:var(--soft);font-size:.93rem}
.rep .show{margin-inline-start:8px;font-size:.8rem;border:1px solid var(--line);background:none;border-radius:6px;padding:2px 8px;cursor:pointer;color:var(--soft);min-height:28px}
.rep .show:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:32px;color:var(--soft);font-size:.86rem;border-top:1px solid var(--line);padding-top:12px}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .district.wide{grid-column:auto}
  .panel{position:fixed;inset-inline:0;bottom:0;top:auto;max-height:52vh;border-radius:16px 16px 0 0;border-bottom:0;z-index:5;padding-bottom:max(16px,env(safe-area-inset-bottom))}
  .panel.idle{display:none}
  body.sheet .wrap{padding-bottom:56vh}
}
@media (min-width:981px){.close{display:none}}
@media (prefers-reduced-motion: reduce){.b{transition:none}}
@media print{.bar,.chips,.tabs,.lang,.close{display:none}.panel{position:static;max-height:none;box-shadow:none}.rep[hidden]{display:block!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">__TITLE__</h1>
    <p id="sub"></p>
  </header>
  <div class="bar">
    <label><span data-i18n="lit"></span>
      <select id="days" aria-label="days"><option value="30">30</option><option value="90">90</option><option value="180">180</option><option value="365">365</option></select>
    </label>
    <input id="q" type="search" autocomplete="off" data-i18n-ph="search">
    <button class="lang" id="lang" type="button"></button>
  </div>
  <ul class="legend">
    <li><svg width="22" height="18" viewBox="0 0 22 18" aria-hidden="true"><rect x="2" y="9" width="6" height="8" fill="var(--wall-r)"/><rect x="11" y="2" width="6" height="15" fill="var(--wall-r)"/></svg><span data-i18n="legend_h"></span></li>
    <li><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="5" height="5" fill="var(--lit)"/><rect x="10" y="3" width="5" height="5" fill="var(--win)"/><rect x="3" y="10" width="5" height="5" fill="var(--lit)"/><rect x="10" y="10" width="5" height="5" fill="var(--win)"/></svg><span data-i18n="legend_l"></span></li>
    <li><svg width="18" height="20" viewBox="0 0 18 20" aria-hidden="true"><path class="flag" d="M4,19v-17l11,4l-11,4"/></svg><span data-i18n="legend_f"></span></li>
    <li><svg width="22" height="20" viewBox="0 0 22 20" aria-hidden="true"><path class="crane" d="M8,19v-15h13m-13,0l-5,3m12,-3v5"/></svg><span data-i18n="legend_c"></span></li>
  </ul>
  <div class="chips" id="chips"></div>
  <div class="layout">
    <main class="town" id="town"><!--__DISTRICTS__--></main>
    <aside class="panel idle" id="panel" aria-live="polite"></aside>
  </div>
  <section class="reports">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="reps"></div>
  </section>
  <footer><span data-i18n="private"></span> <span id="made"></span></footer>
</div>
<script id="data" type="application/json">/*__DATA__*/</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("data").textContent);
var lang = D.lang, sel = null, focus = null, focusKey = null;
var town = document.getElementById("town"), panel = document.getElementById("panel");
function t(k, vars){
  var s = (D.labels[lang] && D.labels[lang][k]) || D.labels.en[k] || k;
  if (vars) for (var v in vars) s = s.replace("{" + v + "}", "\u2066" + String(vars[v]).replace(/-/g, "\u2011") + "\u2069");   // keep dates and numbers in order in Arabic
  return s;
}
function el(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function tx(text){ return el("bdi", "", text); }            // card text keeps its own direction inside an Arabic page
function why(text, label){                                   // a label in the page's language, then the card's own words
  var w = el("span", "why");
  if (label) w.appendChild(document.createTextNode(label + ": "));
  w.appendChild(tx(text));
  return w;
}
function all(q, root){ return Array.prototype.slice.call((root || document).querySelectorAll(q)); }
function byId(id){ return document.getElementById("b-" + id); }

function relight(){
  var days = +document.getElementById("days").value, now = Date.parse(D.today);
  all(".b").forEach(function(b){
    var last = b.getAttribute("data-last");
    b.classList.toggle("lit", !!last && (now - Date.parse(last)) / 864e5 <= days);
  });
}
function paint(){
  var on = {};
  (focus || []).forEach(function(id){ on[id] = 1; });
  town.classList.toggle("focus", !!(sel || focus));
  all(".b").forEach(function(b){
    var id = b.getAttribute("data-id");
    b.classList.toggle("sel", id === sel);
    b.classList.toggle("on", !!on[id] && id !== sel);
    b.setAttribute("aria-pressed", id === sel ? "true" : "false");
  });
  all(".lb[data-for]").forEach(function(l){
    var id = l.getAttribute("data-for");
    l.classList.toggle("on", id === sel || !!on[id]);
  });
  all(".pick").forEach(function(p){
    var id = p.getAttribute("data-id");
    p.classList.toggle("sel", id === sel);
    p.classList.toggle("on", !!on[id] && id !== sel);
  });
  all(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c.getAttribute("data-key") === focusKey ? "true" : "false"); });
}
function tied(id){
  var out = {};
  D.cards[id].links.forEach(function(l){ l.to.forEach(function(x){ out[x] = 1; }); });
  for (var k in D.cards) D.cards[k].links.forEach(function(l){ if (l.to.indexOf(id) >= 0) out[k] = 1; });
  delete out[id];
  return Object.keys(out);
}
function select(id, scroll){
  sel = id; focusKey = null;
  focus = id ? tied(id) : null;
  renderPanel();
  paint();
  if (id && scroll){
    var b = byId(id);
    if (b && b.scrollIntoView) b.scrollIntoView({block: "center", inline: "nearest"});
  }
}
function highlight(ids, key){
  if (key && key === focusKey){ focus = null; focusKey = null; }
  else { focus = ids.slice(); focusKey = key || null; }
  sel = null;
  renderPanel();
  paint();
}
function list(parent, head, items, make){
  if (!items || !items.length) return;
  parent.appendChild(el("h3", "", head));
  var ul = el("ul");
  items.forEach(function(it){ var li = el("li"); make(li, it); ul.appendChild(li); });
  parent.appendChild(ul);
}
function plain(li, text){ li.appendChild(tx(text)); }
function jump(id){
  var a = el("a", "jump"); a.appendChild(tx(D.cards[id].name));
  a.href = "#b-" + id;
  a.addEventListener("click", function(e){ e.preventDefault(); select(id, true); });
  return a;
}
function renderPanel(){
  panel.textContent = "";
  document.body.classList.toggle("sheet", !!sel);
  panel.classList.toggle("idle", !sel);
  if (!sel){ panel.appendChild(el("p", "empty", t("pick"))); return; }
  var c = D.cards[sel];
  var x = el("button", "close", "×"); x.type = "button"; x.setAttribute("aria-label", t("close"));
  x.addEventListener("click", function(){ select(null); });
  panel.appendChild(x);
  panel.appendChild(el("h2")).appendChild(tx(c.name));
  if (c.one_line) panel.appendChild(el("p", "one")).appendChild(tx(c.one_line));
  var meta = el("ul", "meta");
  [c.area, c.kind].forEach(function(m){ if (m) meta.appendChild(el("li")).appendChild(tx(m)); });
  var last = el("li"); last.appendChild(document.createTextNode(t("last") + ": ")); last.appendChild(tx(c.last_activity || t("no_date"))); meta.appendChild(last);
  panel.appendChild(meta);
  var pur = el("ul");
  [["problem", c.purpose.problem], ["serves", c.purpose.who_it_serves], ["goal", c.purpose.my_goal]].forEach(function(kv){
    if (!kv[1]) return;
    var li = el("li"); li.appendChild(document.createTextNode(t(kv[0]) + ": ")); li.appendChild(tx(kv[1])); pur.appendChild(li);
  });
  if (pur.childNodes.length) panel.appendChild(pur);
  var back = [];
  for (var k in D.cards) D.cards[k].links.forEach(function(l){ if (l.to.indexOf(sel) >= 0) back.push({id: k, how: l.how}); });
  list(panel, t("named_in"), back, function(li, l){
    li.appendChild(jump(l.id));
    if (l.how) li.appendChild(why(" \u00b7 " + l.how));
  });
  list(panel, t("can_do"), c.can_do, plain);
  list(panel, t("exists"), c.exists, plain);
  list(panel, t("needs"), c.needs, function(li, n){
    li.appendChild(tx(n.need));
    li.appendChild(el("span", "tag" + (n.met === "no" ? " no" : ""), t("met_" + n.met)));
    if (n.by) li.appendChild(why(" · " + n.by));
  });
  list(panel, t("unfinished"), c.unfinished, plain);
  list(panel, t("decisions"), c.decisions, plain);
  list(panel, t("parts"), c.parts, function(li, p){
    li.appendChild(tx(p.part));
    if (p.why) li.appendChild(why(" · " + p.why));
  });
  list(panel, t("ideas"), c.ideas, plain);
  list(panel, t("themes_h"), c.themes, plain);
  list(panel, t("unseen"), c.unseen, plain);
  if (c.unknown.length){ panel.appendChild(el("h3", "", t("unknown"))); panel.appendChild(el("p", "why")).appendChild(tx(c.unknown.join(", "))); }
  panel.scrollTop = 0;
}

function chips(){
  var box = document.getElementById("chips");
  box.textContent = "";
  var th = D.reports.overlaps.themes;
  if (!th.length) return;
  box.appendChild(el("span", "cap", t("themes")));
  th.forEach(function(x, i){
    var b = el("button", "chip", x.theme + "\u00a0"); b.type = "button";
    b.appendChild(el("b", "", String(x.projects.length)));
    b.setAttribute("data-key", "theme" + i); b.setAttribute("aria-pressed", "false");
    b.addEventListener("click", function(){ highlight(x.ids, "theme" + i); });
    box.appendChild(b);
  });
}
function row(ul, text, note, ids){
  var li = el("li");
  li.appendChild(tx(text));
  if (ids && ids.length){
    var s = el("button", "show", t("show")); s.type = "button";
    s.addEventListener("click", function(){ highlight(ids); town.scrollIntoView({block: "start"}); });
    li.appendChild(s);
  }
  if (note) li.appendChild(why(note));
  ul.appendChild(li);
}
function block(parent, head, items, make){
  parent.appendChild(el("h3", "", head));
  if (!items.length){ parent.appendChild(el("p", "empty", t("none"))); return; }
  var ul = el("ul");
  items.forEach(function(it){ make(ul, it); });
  parent.appendChild(ul);
}
var REPS = {
  brief: function(p){
    p.appendChild(el("p", "note", t("brief_note")));
    var items = D.reports.brief;
    if (!items.length){ p.appendChild(el("p", "empty", t("none"))); return; }
    var ol = el("ol");
    items.forEach(function(b){
      var li = el("li"); li.appendChild(tx(b.move));
      li.appendChild(why(b.why, t("why")));
      if (b.source.length) li.appendChild(why(b.source.join("; "), t("from")));
      ol.appendChild(li);
    });
    p.appendChild(ol);
  },
  overlaps: function(p){
    var o = D.reports.overlaps;
    p.appendChild(el("p", "note", t("note")));
    block(p, t("o_themes"), o.themes, function(ul, x){ row(ul, x.theme + " (" + x.projects.length + ")", x.projects.join(", "), x.ids); });
    block(p, t("o_stated"), o.stated, function(ul, x){ row(ul, x.a + " · " + x.b, x.says, x.ids); });
    block(p, t("o_similar"), o.similar, function(ul, x){ row(ul, x.a + " · " + x.b, x.shared.join(", "), x.ids); });
  },
  gaps: function(p){
    var g = D.reports.gaps;
    block(p, t("g_needs"), g.unmet_needs, function(ul, x){ row(ul, x.project + ": " + x.need, t("met_" + x.met) + (x.by ? " · " + x.by : ""), [x.id]); });
    block(p, t("g_unfinished"), g.unfinished, function(ul, x){ row(ul, x.project + ": " + x.what, x.detail, [x.id]); });
    block(p, t("g_decisions"), g.open_decisions, function(ul, x){ row(ul, x.project + ": " + x.decision, "", [x.id]); });
    block(p, t("g_named"), g.named_without_card, function(ul, x){ row(ul, x.name, t("named_by") + " " + x.named_by.join(", ")); });
    block(p, t("g_unclear"), g.unclear_names, function(ul, x){ row(ul, x.name, t("named_by") + " " + x.named_by.join(", ") + " \u00b7 " + t("could_be") + " " + x.could_be.join(", ")); });
    block(p, t("g_empty"), g.empty_areas, function(ul, x){ row(ul, x); });
    block(p, t("g_alone"), g.standing_alone, function(ul, x){ row(ul, x.project, "", [x.id]); });
    block(p, t("g_quiet", {n: g.quiet_days}), g.quiet, function(ul, x){ row(ul, x.project, x.last ? t("last") + ": " + x.last : t("no_date"), [x.id]); });
    block(p, t("g_unknown"), g.unknown, function(ul, x){ row(ul, x.project, x.unknown.join(", "), [x.id]); });
  },
  reuse: function(p){
    var r = D.reports.reuse;
    p.appendChild(el("p", "note", t("note")));
    block(p, t("r_named"), r.named, function(ul, x){ row(ul, x.part + " · " + x.from + " → " + x.to, x.why, x.ids); });
    block(p, t("r_matched"), r.matched, function(ul, x){ row(ul, x.part + " · " + x.from + " → " + x.to, x["for"] + " (" + x.shared.join(", ") + ")", x.ids); });
    block(p, t("r_wide"), r.wide, function(ul, x){ row(ul, x.part + " · " + x.from, x.why, [x.id]); });
  }
};
var tab = "brief";
function reports(){
  var tabs = document.getElementById("tabs"), reps = document.getElementById("reps");
  tabs.textContent = ""; reps.textContent = "";
  Object.keys(REPS).forEach(function(k){
    var b = el("button", "tab", t("tab_" + k)); b.type = "button";
    b.setAttribute("role", "tab"); b.setAttribute("aria-selected", k === tab ? "true" : "false");
    b.setAttribute("aria-controls", "rep-" + k); b.id = "tab-" + k;
    b.addEventListener("click", function(){ tab = k; reports(); });
    tabs.appendChild(b);
    var p = el("div", "rep"); p.id = "rep-" + k; p.setAttribute("role", "tabpanel"); p.setAttribute("aria-labelledby", "tab-" + k);
    p.hidden = k !== tab;
    REPS[k](p);
    reps.appendChild(p);
  });
}
function words(){
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  var title = D.title || t("title");
  document.title = title;
  document.getElementById("h1").textContent = title;
  document.getElementById("sub").textContent = t("sub", {n: Object.keys(D.cards).length, a: D.areas, d: D.newest || t("no_date")});
  document.getElementById("made").textContent = t("made", {d: D.today});
  document.getElementById("lang").textContent = lang === "ar" ? "English" : "عربي";
  all("[data-i18n]").forEach(function(e){ e.textContent = t(e.getAttribute("data-i18n")); });
  all("[data-i18n-ph]").forEach(function(e){ e.placeholder = t(e.getAttribute("data-i18n-ph")); e.setAttribute("aria-label", e.placeholder); });
  all("#days option").forEach(function(o){ o.textContent = t("days", {n: o.value}); });
  chips(); reports(); renderPanel(); paint();
}

town.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".b, .pick") : null;
  if (b) select(b.getAttribute("data-id") === sel ? null : b.getAttribute("data-id"));
});
town.addEventListener("keydown", function(e){
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("b")){
    e.preventDefault();
    select(e.target.getAttribute("data-id") === sel ? null : e.target.getAttribute("data-id"));
  }
});
document.addEventListener("keydown", function(e){ if (e.key === "Escape"){ focus = null; focusKey = null; select(null); } });
document.getElementById("days").addEventListener("change", relight);
document.getElementById("q").addEventListener("input", function(){
  var q = this.value.trim().toLowerCase();
  if (!q){ all(".pick").forEach(function(p){ p.classList.remove("hide"); }); focus = null; focusKey = null; sel = null; renderPanel(); paint(); return; }
  var hit = [];
  for (var id in D.cards){
    var c = D.cards[id];
    if ((c.name + " " + c.one_line + " " + c.area).toLowerCase().indexOf(q) >= 0) hit.push(id);
  }
  all(".pick").forEach(function(p){ p.classList.toggle("hide", hit.indexOf(p.getAttribute("data-id")) < 0); });
  sel = null; focus = hit; focusKey = null; renderPanel(); paint();
});
document.getElementById("lang").addEventListener("click", function(){ lang = lang === "ar" ? "en" : "ar"; words(); });

document.getElementById("days").value = String([30, 90, 180, 365].indexOf(D.quiet_days) >= 0 ? D.quiet_days : 90);
relight();
words();
})();
</script>
</body>
