[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgebreeder"
version = "0.1.0"
description = "Turns engineering drawings into a process knowledge graph that improves every run, then multiplies what you can do with it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pypdfium2>=4.30", "networkx>=3.2"]

[project.optional-dependencies]
seed = ["pillow>=10.0", "pydantic>=2.6", "duckdb>=1.1"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
kb = "knowledgebreeder.cli:main"

[tool.setuptools.packages.find]
include = ["knowledgebreeder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
