# Claude builds kb: an issue or comment from the repository's owner that asks @claude starts a build.
# kb's page opens such an issue when you press Send to Claude. Claude works on a branch and opens a pull request;
# nothing reaches main until the owner merges it.
# Needs, once: the Claude GitHub app on this repository (https://github.com/apps/claude), and the repository secret
# ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions).
name: Claude builds

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # only the owner can start a build, so a stranger's issue on this public repository spends nothing
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
